<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Afetti - Mensagem do Dia</title>
<style>
  body{margin:0; background:#fdecea; font-family:Arial,sans-serif; display:flex; justify-content:center; padding:0; min-height:100vh;}
 .container{width:100%; max-width:440px; padding:30px 20px 20px; position:relative; display:flex; flex-direction:column; align-items:center;}
 .logo-wrap{width:140px; height:140px; background:white; border-radius:50%; display:flex; align-items:center; justify-content:center; box-shadow:0 4px 15px rgba(0,0,0,0.08); z-index:10; margin-bottom:-40px; border:3px solid #fff; overflow:hidden;}
 .logo-wrap img{width:90%; height:auto; object-fit:contain;}
 .card{background:white; width:100%; border-radius:28px; padding:60px 22px 28px; box-shadow:0 8px 25px rgba(0,0,0,0.06); text-align:center;}
 .title{color:#9c7a2f; font-weight:700; letter-spacing:2px; font-size:22px; line-height:1.3; margin:0 0 18px;}
 .verse-box{background:#fff9e6; border:2px solid #d9b96a; border-radius:16px; padding:24px 18px; min-height:280px; display:flex; flex-direction:column; justify-content:center; align-items:center;}
 .verse-text{font-size:19px; color:#4a3a1a; line-height:1.5; font-style:italic;}
 .date{margin-top:14px; font-size:12px; color:#b8a07a;}
 .footer{margin-top:18px; background:#f9e2e0; border-radius:20px; padding:10px 16px; display:flex; align-items:center; justify-content:center; gap:8px; font-size:13px; color:#5a3a3a; width:100%; box-sizing:border-box;}
 .footer a{color:#5a3a3a; text-decoration:none; font-weight:600;}
 .btn{margin-top:14px; background:#e67e6f; color:white; border:none; padding:10px 22px; border-radius:20px; font-size:14px; cursor:pointer;}
</style>
</head>
<body>
<div class="container">
  <div class="logo-wrap"><img src="logo.jpg" alt="Afetti" onerror="this.src='logo.png'; this.onerror=function(){this.style.display='none'}"></div>
  <div class="card">
    <h1 class="title">• BOM DIA •<br>MENSAGEM DE HOJE</h1>
    <div class="verse-box">
      <div class="verse-text" id="verse">Carregando...</div>
      <div class="date" id="date"></div>
    </div>
    <button class="btn" onclick="shareVerse()">Compartilhar ❤️</button>
  </div>
  <div class="footer">
    <span>📷</span><a href="https://instagram.com/afetti.ateliecriatividadedeamor" target="_blank">@afetti.ateliecriatividadedeamor</a>
    <span>|</span>
    <span>📞</span><a href="https://wa.me/5551995421753" target="_blank">51 995421753</a>
  </div>
</div>
<script>
const verses = [
"Filipenses 4:6-7 - Não andem ansiosos por coisa alguma, mas em tudo, pela oração e súplicas, apresentem seus pedidos a Deus.",
"Jeremias 29:11 - Porque sou eu que conheço os planos que tenho para vocês, diz o Senhor, planos de fazê-los prosperar.",
"Isaías 41:10 - Não tema, pois estou com você; não tenha medo, pois sou o seu Deus.",
"Salmos 46:1 - Deus é o nosso refúgio e a nossa fortaleza, auxílio sempre presente.",
"Romanos 8:28 - Sabemos que Deus age em todas as coisas para o bem daqueles que o amam.",
"Provérbios 3:5-6 - Confie no Senhor de todo o seu coração e não se apoie em seu próprio entendimento.",
"João 3:16 - Porque Deus amou o mundo que deu o seu Filho para que todo que nele crer não pereça.",
"Salmos 23:1 - O Senhor é o meu pastor; de nada terei falta.",
"Filipenses 4:13 - Tudo posso naquele que me fortalece.",
"2 Timóteo 1:7 - Deus não nos deu espírito de covardia, mas de poder, de amor e equilíbrio.",
"Josué 1:9 - Seja forte e corajoso! O Senhor estará com você por onde você andar.",
"Salmos 27:1 - O Senhor é a minha luz e salvação; de quem terei temor?",
"Isaías 40:31 - Aqueles que esperam no Senhor renovarão as suas forças. Voarão alto como águias.",
"Romanos 12:2 - Não se amoldem ao padrão deste mundo, mas transformem-se pela renovação da sua mente.",
"Mateus 11:28 - Venham a mim, todos que estão cansados e sobrecarregados, e eu lhes darei descanso.",
"Salmos 118:24 - Este é o dia que o Senhor fez; alegremo-nos neste dia.",
"Provérbios 16:3 - Consagre ao Senhor tudo o que você faz, e os seus planos serão bem-sucedidos.",
"1 Coríntios 16:14 - Façam tudo com amor.",
"Jeremias 33:3 - Clame a mim e eu responderei e lhe direi coisas grandiosas.",
"Salmos 37:4 - Deleite-se no Senhor, e ele atenderá aos desejos do seu coração.",
"Salmos 91:1 - Aquele que habita no abrigo do Altíssimo descansará à sombra do Todo-poderoso.",
"Filipenses 4:19 - O meu Deus suprirá todas as necessidades de vocês.",
"João 8:12 - Eu sou a luz do mundo. Quem me segue, nunca andará em trevas.",
"Salmos 139:14 - Eu te louvo porque me fizeste de modo especial e admirável.",
"2 Coríntios 12:9 - Minha graça é suficiente para você, pois o meu poder se aperfeiçoa na fraqueza.",
"Colossenses 3:23 - Tudo o que fizerem, façam de todo o coração, como para o Senhor.",
"Romanos 8:31 - Se Deus é por nós, quem será contra nós?",
"Isaías 43:2 - Quando você atravessar as águas, eu estarei com você.",
"Mateus 5:9 - Bem-aventurados os pacificadores, pois serão chamados filhos de Deus.",
"Salmos 100:4 - Entrem por suas portas com ações de graças e em seus átrios com louvor."
];

function getDay(){ const now=new Date(); const start=new Date(now.getFullYear(),0,0); return Math.floor((now-start)/(1000*60*60*24)) % verses.length; }
function load(){ const idx=getDay(); const d=new Date(); document.getElementById('date').innerText=d.toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long'})+" • Dia "+(idx+1)+" de 365"; document.getElementById('verse').innerText=verses[idx]; }
function shareVerse(){ const v=document.getElementById('verse').innerText; if(navigator.share){navigator.share({title:'Afetti',text:v})}else{navigator.clipboard.writeText(v); alert('Copiado!');} }
load();
</script>
</body>
</html>
