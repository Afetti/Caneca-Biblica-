<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Versículo do Dia • Afetti Ateliê</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #fceade 0%, #f7d6d0 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 30px 20px;
        }
        .card-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            max-width: 420px;
            width: 100%;
        }
        /* Logotipo totalmente fora e acima do cartão */
        .logo-out {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            object-fit: cover;
            box-shadow: 0 10px 25px rgba(186, 115, 126, 0.3);
            border: 4px solid #ffffff;
            margin-bottom: 25px; /* Mantém o logo completamente separado do quadrado */
        }
        .card {
            background: #ffffff;
            border-radius: 24px;
            padding: 40px 25px;
            width: 100%;
            box-shadow: 0 15px 35px rgba(186, 115, 126, 0.15);
            text-align: center;
            border: 1px solid rgba(224, 162, 172, 0.3);
        }
        .header {
            font-size: 0.8rem;
            font-weight: 700;
            letter-spacing: 1.5px;
            color: #b0727b;
            text-transform: uppercase;
            margin-bottom: 25px;
        }
        .texto {
            font-size: 1.3rem;
            line-height: 1.6;
            color: #4a3336;
            font-weight: 400;
            margin-bottom: 25px;
            font-style: italic;
        }
        .referencia {
            font-size: 0.95rem;
            font-weight: 600;
            color: #8f4f58;
            display: inline-block;
            background: #fbf0ee;
            padding: 8px 20px;
            border-radius: 20px;
            border: 1px solid rgba(224, 162, 172, 0.3);
        }
    </style>
</head>
<body>

    <div class="card-container">
        <!-- Logotipo separado no topo -->
        <img src="https://github.com/Afetti.png" alt="Afetti Ateliê" class="logo-out">

        <div class="card">
            <div class="header">Bom Dia • Mensagem de Hoje</div>
            <div class="texto" id="versiculo">O Senhor é o meu pastor, nada me faltará.</div>
            <div class="referencia" id="referencia">Salmos 23:1</div>
        </div>
    </div>

    <script>
        const lista = [
            { texto: "No princípio, criou Deus os céus e a terra.", ref: "Gênesis 1:1" },
            { texto: "O Senhor é o meu pastor, nada me faltará.", ref: "Salmos 23:1" },
            { texto: "Tudo posso naquele que me fortalece.", ref: "Filipenses 4:13" },
            { texto: "Entrega o teu caminho ao Senhor; confia nele, e ele o fará.", ref: "Salmos 37:5" },
            { texto: "O amor é paciente, o amor é bondoso.", ref: "1 Coríntios 13:4" },
            { texto: "Porque sou eu que conheço os planos que tenho para vocês, diz o Senhor.", ref: "Jeremias 29:11" },
            { texto: "Este é o dia que fez o Senhor; regozijemo-nos e alegremo-nos nele.", ref: "Salmos 118:24" },
            { texto: "Buscai primeiro o Reino de Deus e a sua justiça, e todas estas coisas vos serão acrescentadas.", ref: "Mateus 6:33" },
            { texto: "O Senhor é a minha luz e a minha salvação; de quem terei medo?", ref: "Salmos 27:1" },
            { texto: "Lâmpada para os meus pés é tua palavra e luz, para o meu caminho.", ref: "Salmos 119:105" }
        ];

        try {
            const agora = new Date();
            const inicio = new Date(agora.getFullYear(), 0, 0);
            const dia = Math.floor((agora - inicio) / (1000 * 60 * 60 * 24));
            const item = lista[(dia - 1) % lista.length];
            
            document.getElementById('versiculo').textContent = item.texto;
            document.getElementById('referencia').textContent = item.ref;
        } catch (e) {
            console.log("Executando modo padrão");
        }
    </script>
</body>
</html>
