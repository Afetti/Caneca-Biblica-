<style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@700&display=swap');
body{margin:0;background:#fff8f5;display:flex;justify-content:center;font-family:Arial,sans-serif;}
.bg{position:fixed;inset:0;background:radial-gradient(ellipse at 10% 0%, #f7b9a5 0%, transparent 45%),radial-gradient(ellipse at 90% 100%, #f7b9a5 0%, transparent 45%),#fffaf7;z-index:-1;}
.container{width:100%;max-width:420px;min-height:100vh;padding:6px 0 6px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;box-sizing:border-box;}
/* LOGO CORRIGIDO - NÃO PEGA MAIS NO CARD */
.logo{width:130px;height:130px;background:white;border-radius:50%;display:flex;align-items:center;justify-content:center;margin-top:6px;margin-bottom:10px;flex-shrink:0;box-shadow:0 2px 8px rgba(0,0,0,0.08);}
.logo img{width:92%;height:92%;object-fit:contain;border-radius:50%;display:block;}
.card{background:white;width:92%;border-radius:22px;box-shadow:0 8px 18px rgba(0,0,0,0.06);margin-top:0;padding:14px 12px 8px;text-align:center;flex-shrink:0;}
.titleWrap{position:relative;border:1.5px solid #d4b368;border-radius:14px;padding:9px 44px;margin:0 2px 8px;}
.leafL,.leafR{position:absolute;top:50%;width:36px;}.leafL{left:-10px;transform:translateY(-50%);}.leafR{right:-10px;transform:translateY(-50%) scaleX(-1);}
.title{font-family:'Cinzel',serif;color:#a67c2e;font-weight:700;font-size:18px;line-height:1.2;margin:0;}
/* BIBLIA CORRIGIDA - VERSÍCULO VOLTOU */
.bibleWrap{position:relative;width:100%;margin-top:4px;display:flex;justify-content:center;}
.bibleWrap img.bible{width:100%;max-width:100%;display:block;}
.verseOverlay{position:absolute;top:50%;left:69%;transform:translate(-50%,-50%);width:34%;height:80%;display:flex;flex-direction:column;justify-content:center;align-items:center;box-sizing:border-box;padding:0 6px;z-index:2;}
.verseText{font-family:Georgia,serif;font-size:12.5px;line-height:1.3;color:#2b1a0e;text-align:center;font-weight:700;text-shadow:0 1px 2px rgba(255,255,255,0.8);}
.verseRef{display:block;margin-top:6px;font-family:Georgia,serif;font-size:11px;color:#a67c2e;font-weight:800;text-align:center;}
.btn{margin-top:8px;background:#e68a7f;color:white;border:none;padding:7px 18px;border-radius:18px;font-weight:700;font-size:12.5px;cursor:pointer;}
.bottomBranches{position:relative;width:100%;height:28px;margin-top:8px;}
.bottomBranches img{width:38px;position:absolute;top:50%;}.bL{left:18px;transform:translateY(-50%);}.bR{right:18px;transform:translateY(-50%) scaleX(-1);}
.footer{margin-top:8px;width:92%;background:#f9d9d5;border-radius:20px;padding:7px 10px;display:flex;justify-content:center;align-items:center;gap:6px;font-size:11px;color:#3a2222;flex-shrink:0;}
.footer a{color:#3a2222;text-decoration:none;font-weight:700;display:flex;align-items:center;gap:5px;}
.footer img.icon{width:19px;height:19px;object-fit:contain;display:block;}
</style>
</head>

function getDay(){const n=new Date();const s=new Date(n.getFullYear(),0,0);return Math.floor((n-s)/(1000*60*60*24));}

document.getElementById('vRef').innerText="- "+v.r;
